name: Pages

# Builds the interactive diagram gallery (scripts/site.mjs) and deploys it to
# GitHub Pages: https://grethel-labs.github.io/excaliplant/

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "src/**"
      - "scripts/site.mjs"
      - "scripts/showcase.mjs"
      - "assets/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/site.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
