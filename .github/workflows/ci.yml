name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, types, docs, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - name: Generated docs are up to date
        run: npm run docs:check
      - run: npm audit --omit=dev --audit-level=high

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Pack and smoke-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install into a clean project and smoke-test
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install "$RUNNER_TEMP"/grethel-labs-excaliplant-*.tgz
          cp "$GITHUB_WORKSPACE/scripts/smoke.mjs" .
          node smoke.mjs

  integrations:
    name: Build VS Code and Obsidian bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix integrations/vscode
      - run: npm ci --prefix integrations/obsidian
      # With the tooling installed, the bundle tests run instead of skipping.
      - run: node --test test/vscode.test.mjs test/vscode_build.test.mjs test/obsidian.test.mjs test/obsidian-build.test.mjs
      - name: Package the artefacts
        run: |
          set -euo pipefail
          node scripts/build-vscode.mjs --version 0.0.1
          node scripts/build-obsidian.mjs --version 0.0.1 --out "$RUNNER_TEMP/obsidian"

  # The playground renders in a Web Worker, which neither the unit tests nor the
  # vm sandbox start. This job builds the site and opens it in a real browser
  # (scripts/site-smoke.mjs); it would have caught the v1.4.0 bug where the
  # lazily loaded layout engine replaced the worker's message handler.
  site:
    name: Site smoke test (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site
      - name: Make sure a browser is available
        run: command -v google-chrome >/dev/null || npx playwright-core install --with-deps chromium
      - name: Open the built site in a browser
        run: npm run site:smoke -- --shots "$RUNNER_TEMP/site-shots"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-smoke-screenshots
          path: ${{ runner.temp }}/site-shots
          if-no-files-found: ignore
