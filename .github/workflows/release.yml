name: Release

# Publishes to npm when a pull request is merged into main.
#
#   1. Read the release:* label of the merged PR (or the manual input).
#   2. Compute the next version from the latest v* tag.
#   3. Run the full quality gate, set the version in the runner only
#      (nothing is committed back), pack and smoke-test the tarball.
#   4. npm publish with provenance, then create the tag + GitHub release.
#
# Every step is idempotent: re-running a failed release skips an already
# published version and only creates what is missing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine bump
        id: bump
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${{ inputs.bump }}"
          else
            labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '[.[0].labels[]?.name | select(startswith("release:"))] | join(",")' || true)
            case "$labels" in
              release:major) bump=major ;;
              release:minor) bump=minor ;;
              release:patch) bump=patch ;;
              *) bump=none ;;
            esac
            echo "Merged PR release label: ${labels:-<none>}"
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
      - name: Compute version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          version=$(node scripts/next-version.mjs "${{ steps.bump.outputs.bump }}" "$latest")
          echo "Latest tag: ${latest:-<none>} → next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish v${{ needs.plan.outputs.version }}
    needs: plan
    if: needs.plan.outputs.bump != 'none'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing support
        run: npm install -g npm@11
      - run: npm ci
      - name: Quality gate
        run: |
          npm run format:check
          npm run typecheck
          npm test
          npm run docs:check
          npm audit --omit=dev --audit-level=high
      - name: Set version (runner only)
        run: npm version "$VERSION" --no-git-tag-version
      - name: Pack and smoke-test
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install "$RUNNER_TEMP/grethel-labs-excaliplant-$VERSION.tgz"
          cp "$GITHUB_WORKSPACE/scripts/smoke.mjs" .
          node smoke.mjs
      # Authenticates via npm trusted publishing (OIDC, `id-token: write`);
      # no long-lived npm token is used.
      - name: Publish to npm
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$name@$VERSION is already on npm; skipping publish."
          else
            npm publish "$RUNNER_TEMP/grethel-labs-excaliplant-$VERSION.tgz" --access public --provenance --tag latest
          fi
      - name: Tag and GitHub release
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists."
          else
            # GITHUB_TOKEN may not tag commits that change workflow files;
            # in that case a maintainer runs the printed command once.
            if ! gh release create "v$VERSION" "$RUNNER_TEMP/grethel-labs-excaliplant-$VERSION.tgz" \
              --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest; then
              echo "::error::npm publish succeeded, but the GitHub release could not be created. Run locally: gh release create v$VERSION --target $GITHUB_SHA --title v$VERSION --generate-notes --latest"
              exit 1
            fi
          fi
      # Skill, plugin and rules archives are built from the same tree as the
      # npm package; `--pack` fails on a stale generated tree.
      - name: Attach agent-skill artefacts to the release
        run: |
          set -euo pipefail
          EXCALIPLANT_VERSION="$VERSION" node scripts/skills.mjs --pack "$RUNNER_TEMP/skills"
          gh release upload "v$VERSION" "$RUNNER_TEMP"/skills/* --clobber
      - name: Summary
        run: |
          {
            echo "### Published @grethel-labs/excaliplant@$VERSION"
            echo ""
            echo "- npm: https://www.npmjs.com/package/@grethel-labs/excaliplant/v/$VERSION"
            echo "- release: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs after npm: the registry verifies that the package version exists and
  # that `mcpName` in package.json matches. Authenticates via GitHub OIDC; no
  # secret is needed. A failure here does not undo the npm release; re-run
  # this job (a registry version can only be published once).
  mcp-registry:
    name: Publish MCP registry entry
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # npm needs a few minutes to serve a freshly published version, and the
      # registry rejects a version it cannot see yet. Wait for it here instead
      # of failing and re-running the job by hand.
      - name: Wait until the version is available on npm
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          for i in $(seq 1 60); do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is available."
              sleep 10 # let the registry's own lookup catch up
              exit 0
            fi
            echo "Waiting for $name@$VERSION on npm ($i/60)..."
            sleep 15
          done
          echo "::error::$name@$VERSION is not on npm after 15 minutes."
          exit 1
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Set the version in server.json (runner only)
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # Obsidian needs a repository whose root holds manifest.json and whose tags
  # equal the manifest version (no `v`), so the plugin is mirrored into
  # grethel-labs/excaliplant-obsidian. This job pushes the built files and the
  # tag with a deploy key that can write to that one repository only (secret
  # OBSIDIAN_DEPLOY_KEY); the mirror's own workflow turns the tag into the
  # GitHub release. See docs/obsidian.md. DISABLED by default: it only runs
  # when the repository variable PUBLISH_OBSIDIAN is "true".
  obsidian:
    name: Mirror Obsidian plugin
    needs: [plan, publish]
    if: ${{ vars.PUBLISH_OBSIDIAN == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      OBSIDIAN_DEPLOY_KEY: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}
    steps:
      - name: Check for the deploy key
        id: key
        run: |
          if [ -z "$OBSIDIAN_DEPLOY_KEY" ]; then
            echo "::notice::OBSIDIAN_DEPLOY_KEY is not set; skipping the Obsidian mirror."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          repository: grethel-labs/excaliplant-obsidian
          ssh-key: ${{ secrets.OBSIDIAN_DEPLOY_KEY }}
          path: mirror
      - name: Build, mirror and tag
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          npm ci
          (cd integrations/obsidian && npm ci)
          node scripts/build-obsidian.mjs --version "$VERSION" --out mirror \
            --base-versions mirror/versions.json --repo-files
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror is already up to date."
          else
            git commit -m "Excaliplant $VERSION"
            git push origin HEAD:main
          fi
          # The tag comes after the manifest commit is on main; the mirror's
          # workflow creates the release from it.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::notice::Mirror tag $VERSION already exists."
          else
            git tag -a "$VERSION" -m "Excaliplant $VERSION"
            git push origin "$VERSION"
          fi

  # The .vsix is attached to the GitHub release and published to the VS Code
  # Marketplace and Open VSX. Both registries support trusted publishing (OIDC),
  # so no token has to be stored: register this workflow (release.yml, no
  # environment) as trusted publisher there, then set the repository variables
  # PUBLISH_VSCODE_MARKETPLACE / PUBLISH_OPEN_VSX to "true". A stored VSCE_PAT /
  # OVSX_PAT still works and takes precedence (Open VSX needs one token for the
  # very first version). See docs/vscode.md.
  vscode:
    name: Package and publish VS Code extension
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      PUBLISH_VSCODE_MARKETPLACE: ${{ vars.PUBLISH_VSCODE_MARKETPLACE }}
      PUBLISH_OPEN_VSX: ${{ vars.PUBLISH_OPEN_VSX }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix integrations/vscode
      - name: Package the extension
        run: node scripts/build-vscode.mjs --version "$VERSION"
      - name: Attach the .vsix to the release
        run: gh release upload "v$VERSION" "integrations/vscode/dist/excaliplant-$VERSION.vsix" --clobber
      - name: Publish to the VS Code Marketplace
        working-directory: integrations/vscode
        run: |
          set -euo pipefail
          vsix="dist/excaliplant-$VERSION.vsix"
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath "$vsix"
          elif [ "$PUBLISH_VSCODE_MARKETPLACE" = "true" ]; then
            npx vsce publish --oidc --packagePath "$vsix"
          else
            echo "::notice::VS Code Marketplace not configured (no VSCE_PAT, PUBLISH_VSCODE_MARKETPLACE is not 'true'); skipping."
          fi
      - name: Publish to Open VSX
        working-directory: integrations/vscode
        run: |
          set -euo pipefail
          vsix="dist/excaliplant-$VERSION.vsix"
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish "$vsix"
          elif [ "$PUBLISH_OPEN_VSX" = "true" ]; then
            npx ovsx publish "$vsix" --trusted-publishing
          else
            echo "::notice::Open VSX not configured (no OVSX_PAT, PUBLISH_OPEN_VSX is not 'true'); skipping."
          fi

  # The plugin directories (Claude, Codex) track a branch or tag of this
  # repository and want a version that rises with every release, but releases
  # never write to main and the committed plugin files carry no real version.
  # So each release adds ONE commit to the generated branch `plugin-release`
  # (plugin files only, versioned; no workflow files) and tags it
  # plugin-release-vX.Y.Z; the push is always a fast-forward. A failure here does
  # not undo the npm release; re-run this job (it is idempotent). Only the
  # GITHUB_TOKEN is used. See docs/publishing.md.
  plugin-release:
    name: Update plugin-release branch
    needs: [plan, publish]
    if: needs.plan.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the branch content
        run: node scripts/plugin-ref.mjs --version "$VERSION" --out "$RUNNER_TEMP/plugin-ref"
      - name: Commit, tag and push (fast-forward only)
        env:
          SOURCE_SHA: ${{ github.sha }}
          FILES_DIR: ${{ runner.temp }}/plugin-ref
        run: bash scripts/publish-plugin-branch.sh
